<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AE Element Vault</title>
    <!-- Dark background matching After Effects native theme to eliminate docking flash -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #1e1e1e;
        color: #dcdcdc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
    <!-- Adobe CEP CSInterface SDK -->
    <script src="./lib/CSInterface.js"></script>
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body class="bg-[#1e1e1e] text-neutral-200 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root" class="h-screen w-screen flex flex-col overflow-hidden"></div>
  </body>
</html>
